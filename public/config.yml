backend:
  name: git-gateway
  branch: main # Sesuaikan nama branch utama repo kamu (misal: main atau master)

media_folder: "public/images/projects" # Lokasi gambar disimpan di repository
public_folder: "/images/projects" # URL akses gambar di Next.js

collections:
  - name: "projects"
    label: "Projects"
    folder: "content/projects" # Tempat penyimpan data project (Markdown/JSON)
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Thumbnail", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Link Demo/Live", name: "link", widget: "string", required: false }
      - { label: "Body / Full Content", name: "body", widget: "markdown" }